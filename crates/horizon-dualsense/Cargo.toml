[package]
name = "horizon-dualsense"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The DualSense's and Xbox One's output over HID: rumble, adaptive triggers, lights and impulse triggers"

[dependencies]
log = "0.4"

# hidapi has no iOS backend and its build script stops there, so the output's two
# dependencies go only to the targets that have one. On iOS the crate builds without
# output: the Link never opens.
[target.'cfg(not(target_os = "ios"))'.dependencies]
# MIT; bundles the C hidapi under its BSD licence option. hidraw on Linux (libudev, as gilrs),
# IOKit on macOS (opened shared, so gilrs keeps reading the pad), the HID API on Windows.
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw", "macos-shared-device"] }
# HD haptics through the pad's own audio device (USB).
cpal = "0.16"

# Windows.Gaming.Input drives the four motors of a wired Xbox One pad, whose HID endpoint takes
# no output report, and shares the pad with other programs. The same version gilrs uses.
# Windows 7 has no Windows.Gaming.Input, and every `windows` crate on that target leaves a static
# import of `RoGetActivationFactory` from `api-ms-win-core-winrt-l1-1-0.dll`, which the loader
# refuses before `main` (docs/design/opengl2-win7-x86.md §19.9): the Win7 build takes the pad over
# hidapi only, and a wired pad has no trigger output there.
[target.'cfg(all(target_os = "windows", not(target_vendor = "win7")))'.dependencies]
windows = { version = "0.62", features = ["Gaming_Input", "Foundation_Collections"] }

[lints]
workspace = true
