name: Arena legacy-gl checks

# Only this session's branch. Existing CI, PRs and other workflows are not
# read or modified; the full crates.io-backed checks run here instead of in the
# sandbox, whose outbound network does not reach crates.io.
on:
  push:
    branches:
      - 'arena/81644160-horizon'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1
  LIBGL_ALWAYS_SOFTWARE: '1'
  MESA_EXTENSION_MAX_YEAR: '2006'
  MESA_EXTENSION_OVERRIDE: '-GL_ARB_uniform_buffer_object -GL_EXT_texture_array -GL_ARB_instanced_arrays'

jobs:
  legacy-gl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Install Rust 1.99 (workspace needs >= 1.95)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustc --version
          cargo --version

      - name: Install Xvfb and Mesa GL for the smoke frame
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Python caps / contract / public-tree checks
        run: |
          python3 -m unittest tests.test_gl21_caps tests.test_gl21_contract tests.test_gl21_golden -v
          python3 tools/gl21_caps.py \
            --from-file tools/gl21_caps_fixtures/x1650-catalyst93.glxinfo.txt \
            --label ci-gl21 --check --no-write --stdout
          python3 tools/check_public_tree.py
          git diff --check

      - name: rustfmt for the additive gfx21 module and GL smoke example
        run: |
          rustfmt --edition 2024 --check \
            crates/horizon-client-render/src/gfx21/*.rs \
            crates/horizon-client-render/examples/gl21_clear.rs

      - name: Cargo manifest sanity
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Standalone gfx21 unit tests and clippy (no external crates)
        run: |
          mkdir -p /tmp/gfx21-check/src
          cat > /tmp/gfx21-check/Cargo.toml <<'EOF'
          [package]
          name = "gfx21-check"
          version = "0.1.0"
          edition = "2024"
          [lib]
          path = "src/lib.rs"
          EOF
          cat > /tmp/gfx21-check/src/lib.rs <<EOF
          #![forbid(unsafe_code)]
          #[path = "${GITHUB_WORKSPACE}/crates/horizon-client-render/src/gfx21/mod.rs"]
          pub mod gfx21;
          EOF
          cd /tmp/gfx21-check
          GFX21_GOLDEN_OUT=/tmp/legacy-gl-scene.rgba cargo test --offline
          cargo clippy --offline --all-targets -- -D warnings

      - name: Golden frame (CPU reference, no GPU)
        run: |
          python3 tools/legacy_gl_golden.py --check /tmp/legacy-gl-scene.rgba

      - name: PR 2b gate (full workspace, crates.io available here)
        run: |
          set +e
          cargo check -p horizon-client --features legacy-gl --no-default-features > /tmp/gate.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 -c 'import re; from pathlib import Path; t=re.sub(r"\x1b\[[0-9;]*[A-Za-z]","",Path("/tmp/gate.log").read_text(errors="replace")); ls=[l for l in t.splitlines() if not any(k in l for k in ("Downloaded","Compiling","Checking","Updating crates.io"))]; s="\n".join(ls[-120:])[-20000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit "$rc"
          fi
          tail -20 /tmp/gate.log

      - name: gfx21 unit tests inside horizon-client-render
        run: |
          set +e
          cargo test -p horizon-client-render --lib gfx21 --features legacy-gl > /tmp/gfx21-test.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 -c 'import re; from pathlib import Path; t=re.sub(r"\x1b\[[0-9;]*[A-Za-z]","",Path("/tmp/gfx21-test.log").read_text(errors="replace")); ls=[l for l in t.splitlines() if not any(k in l for k in ("Downloaded","Compiling","Checking","Updating crates.io"))]; s="\n".join(ls[-120:])[-20000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit "$rc"
          fi
          tail -30 /tmp/gfx21-test.log

      - name: GL 2.1/2.0 smoke frames under Xvfb
        run: |
          set +e
          : > /tmp/gl21-smoke.log
          for spec in "2.1 120 120" "2.0 120 110"; do
            set -- $spec
            export MESA_GL_VERSION_OVERRIDE="$1"
            export MESA_GLSL_VERSION_OVERRIDE="$2"
            export HORIZON_GLSL_DIALECT="$3"
            echo "=== GL $1 / GLSL override $2 / dialect $3 ===" | tee -a /tmp/gl21-smoke.log
            xvfb-run -a -s '-screen 0 800x600x24' \
              cargo run -p horizon-client-render --example gl21_clear --features legacy-gl \
              >> /tmp/gl21-smoke.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              python3 -c 'import re; from pathlib import Path; t=re.sub(r"\x1b\[[0-9;]*[A-Za-z]","",Path("/tmp/gl21-smoke.log").read_text(errors="replace")); ls=[l for l in t.splitlines() if not any(k in l for k in ("Downloaded","Compiling","Checking","Updating crates.io"))]; s="\n".join(ls[-80:])[-8000:]; [print("::error::"+s[i:i+800].replace("%","%25").replace("\r","%0D").replace("\n","%0A")) for i in range(0,len(s),800)]'
              exit "$rc"
            fi
          done
          tail -40 /tmp/gl21-smoke.log
          grep -q 'gl21_clear: OK' /tmp/gl21-smoke.log || { echo "::error::missing gl21_clear: OK"; exit 1; }
          grep -q 'all programs linked: OK' /tmp/gl21-smoke.log || { echo "::error::missing full program link"; exit 1; }
          test "$(grep -c 'all programs linked: OK' /tmp/gl21-smoke.log)" -eq 2 || { echo "::error::expected two full program sets"; exit 1; }
          grep -q 'DIALECT: Glsl120' /tmp/gl21-smoke.log || { echo "::error::missing Glsl120"; exit 1; }
          grep -q 'DIALECT: Glsl110' /tmp/gl21-smoke.log || { echo "::error::missing Glsl110"; exit 1; }
