# Temporary: the offline research tooling's unit tests, as CI runs them (ubuntu, full history), with the
# failing tests' tracebacks as annotations. Removed once the cause of the `verify` failure is known.
name: Unit test diagnostics
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - .github/workflows/unit-diag.yml
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run the tests
        run: |
          set +e
          python -m unittest discover -s tests -v > ut.txt 2>&1
          code=$?
          python3 - "$code" <<'PY'
          import re, sys
          code = sys.argv[1]
          lines = open("ut.txt", errors="replace").read().splitlines()
          start = [i for i, l in enumerate(lines) if re.match(r"^(FAIL|ERROR): ", l)]
          out = [f"exit={code} python={sys.version.split()[0]}"]
          for i in start[:6]:
              out.extend(lines[i:i+14])
          out.extend(["--- summary ---"] + [l for l in lines if re.match(r"^(Ran |OK|FAILED|FLAKY|FAIL dedicated|RETRIED)", l)][-12:])
          text = "\n".join(out)[:40000]
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=unittest::{esc}")
          PY

  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: The launcher's three checks, with their errors as annotations
        working-directory: launcher
        run: |
          set +e
          cargo +stable fmt --check > f.txt 2>&1; a=$?
          cargo +stable clippy --all-targets --locked -- -D warnings > c.txt 2>&1; b=$?
          cargo +stable test --locked --lib > t.txt 2>&1; d=$?
          python3 - "$a" "$b" "$d" <<'PY'
          import re, sys
          a, b, d = sys.argv[1:4]
          def pick(path, pattern, n):
              lines = open(path, errors="replace").read().splitlines()
              return [l for l in lines if re.search(pattern, l)][:n]
          out = [f"fmt={a} clippy={b} test={d}"]
          out += ["fmt: " + l for l in pick("f.txt", r"Diff in|^error", 12)]
          out += ["clippy: " + l for l in pick("c.txt", r"^error|-->", 24)]
          out += ["test: " + l for l in pick("t.txt", r"panicked|FAILED|test result|^error", 24)]
          text = "\n".join(out)[:40000]
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=launcher::{esc}")
          PY
