# Phase 0 of docs/plans/opengl21-radeon-x1650.md. Builds crates/horizon-gl2, runs its unit tests and
# the probe on Mesa's llvmpipe three ways: the driver as it is, capped to the Radeon X1650's
# OpenGL 2.1 / GLSL 1.20, and the floor (OpenGL 2.0 / GLSL 1.10). llvmpipe is a CPU rasteriser:
# this checks what the API allows, not speed and not the X1650's own driver.
name: GL 2.x probe

on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - crates/horizon-gl2/**
      - .github/workflows/gl2-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/horizon-gl2
    steps:
      - uses: actions/checkout@v4

      - name: Mesa llvmpipe (EGL and desktop OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri

      - name: Unit tests
        run: cargo test

      # Each probe runs even when an earlier one fails: the reports say which mode broke.
      - name: Probe, driver as it is
        continue-on-error: true
        run: cargo run --quiet -- --out out/native.json

      - name: "Probe, capped to OpenGL 2.1 and GLSL 1.20 (the X1650's reported versions)"
        continue-on-error: true
        env:
          MESA_GL_VERSION_OVERRIDE: "2.1"
          MESA_GLSL_VERSION_OVERRIDE: "120"
        run: cargo run --quiet -- --out out/gl21.json

      - name: "Probe, the floor: OpenGL 2.0 and GLSL 1.10"
        continue-on-error: true
        env:
          MESA_GL_VERSION_OVERRIDE: "2.0"
          MESA_GLSL_VERSION_OVERRIDE: "110"
        run: cargo run --quiet -- --out out/gl20.json

      # The reports are also printed as annotations: CI artifacts and logs are the first thing
      # lost when the run is read from outside, annotations survive the check run.
      - name: Every probe must pass
        run: |
          status=0
          for report in out/native.json out/gl21.json out/gl20.json; do
            name=$(basename "$report" .json)
            if [ ! -s "$report" ]; then
              echo "::error title=$name::no report written"
              status=1
              continue
            fi
            echo "::notice title=$name::GL $(jq -r '.gl_version' "$report") | GLSL $(jq -r '.glsl_version' "$report") | $(jq -r '.renderer' "$report")"
            echo "::notice title=$name::checks: $(jq -r '.checks | length' "$report"), error: $(jq -r '.error // "none"' "$report")"
            # The whole report, compact, in 2000-character pieces: a report that looks empty must still be readable.
            jq -c . "$report" | fold -w 2000 | while IFS= read -r line; do echo "::notice title=$name::json $line"; done
            if ! jq -e '.pass == true' "$report" > /dev/null; then
              echo "::error title=$name::did not pass"
              status=1
            fi
          done
          exit $status

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl2-probe-reports
          path: crates/horizon-gl2/out/
          if-no-files-found: warn
