name: Legacy GL integration validation
# CI01: same jobs for scoped PR candidates and aggregate integration heads.
on:
  push:
    branches: ['arena/a7e96628-horizon']
  pull_request:
    branches: ['main', 'arena/a7e96628-horizon']
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: legacy-gl-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    name: legacy/candidate-scope
    if: >-
      github.repository == 'lukintrees/horizon' &&
      (github.event_name != 'pull_request' ||
       github.base_ref == 'arena/a7e96628-horizon' ||
       github.head_ref == 'arena/a7e96628-horizon')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      report: ${{ steps.scope.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check candidate with policy and checker from trusted base
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/legacy-trusted"
          mkdir -p "$trusted"
          # Task PRs may not supply their own checker/policy. Integration draft
          # bootstrap and aggregate pushes are the designated integrator lane.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" = arena/a7e96628-horizon ]; then
            git show "$BASE_SHA:tools/ci/legacy_scope.py" > "$trusted/legacy_scope.py"
            git show "$BASE_SHA:.github/legacy-gl-policy.json" > "$trusted/policy.json"
          else
            cp tools/ci/legacy_scope.py "$trusted/legacy_scope.py"
            cp .github/legacy-gl-policy.json "$trusted/policy.json"
          fi
          python3 "$trusted/legacy_scope.py" --policy "$trusted/policy.json" --report target/legacy-ci/scope.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('target/legacy-ci/scope.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('report=' + json.dumps(report, separators=(',', ':')) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-candidate-evidence
          path: target/legacy-ci/

  policy-tests:
    name: legacy/policy-tests
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s tests -p 'test_legacy_scope.py'
          python3 -m unittest discover -s tests -p 'test_legacy_required.py'
          python3 -m unittest discover -s tests -p 'test_legacy_renderer_inventory.py'
          python3 -m unittest discover -s tests -p 'test_legacy_cpu_contracts.py'
          python3 -m unittest discover -s tests -p 'test_legacy_workflow_scope.py'
          # Archiving unused automation must not remove its security regression tests.
          for suite in ci_runners claim_command nightly overlap_note pr_labels triage_command; do
            python3 -m unittest discover -s tests -p "test_${suite}.py"
          done
          python3 tools/ci/legacy_renderer_inventory.py --check
          python3 tools/check_public_tree.py

  modern:
    name: legacy/modern
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-modern
      - name: Check unchanged default modern feature graph
        run: cargo check --locked -p horizon-client
      - name: Test neutral scheduling and headless loop through actual Game
        run: |
          cargo test --locked -p horizon-client --no-default-features --lib game::event_loop::tests::
          cargo test --locked -p horizon-client --no-default-features --lib game::headless::tests::
          cargo test --locked -p horizon-client --no-default-features --lib game::render_startup::tests::

  terrain-integration:
    name: legacy/cpu-game
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libosmesa6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-gl-branch
      - name: Compile the game bridges and check the full client
        shell: bash
        run: |
          mkdir -p target/legacy-branch
          set +e
          cargo test --locked -p horizon-client-render --features legacy-gl --lib bridge::tests:: --message-format=json > target/legacy-branch/compiler.jsonl 2> target/legacy-branch/cargo.stderr
          status=$?
          for filter in renderer_owner::bootstrap_tests:: renderer_owner::tests:: legacy_gfx::streaming::tests:: legacy_gfx::reload::tests:: legacy_gfx::animation::tests:: hud::tests::checked_pixels_ font::tests::renderer_commit_ legacy_gfx::asset_snapshot::tests:: legacy_gfx::resources::tests:: legacy_gfx::screenshot::tests:: frame::menu:: legacy_gfx::frame::tests:: legacy_gfx::screen::tests:: legacy_gfx::weather::tests:: legacy_gfx::sky::tests:: renderer_facade::tests:: lightmap::tests::; do
            if [ "$status" -eq 0 ]; then
              cargo test --locked -p horizon-client-render --features legacy-gl --lib "$filter" --message-format=json >> target/legacy-branch/compiler.jsonl 2>> target/legacy-branch/cargo.stderr
              status=$?
            fi
          done
          if [ "$status" -eq 0 ]; then
            cargo check --locked -p horizon-client --no-default-features --features legacy-gl --message-format=json > target/legacy-branch/full-client.jsonl 2>> target/legacy-branch/cargo.stderr
            status=$?
          fi
          cat target/legacy-branch/cargo.stderr
          # Standard check annotations make compiler failures readable through the
          # checks API, even when downloading full logs/artifacts is unavailable.
          python3 - <<'PY'
          import json
          from pathlib import Path
          def escape(value):
              return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          count = 0
          test_output = []
          for line in (Path('target/legacy-branch/compiler.jsonl').read_text() + '\n' + (Path('target/legacy-branch/full-client.jsonl').read_text() if Path('target/legacy-branch/full-client.jsonl').exists() else '')).splitlines():
              try:
                  record = json.loads(line)
              except ValueError:
                  print(line)
                  test_output.append(line)
                  continue
              if record.get('reason') != 'compiler-message':
                  continue
              msg = record['message']
              if msg.get('level') != 'error' or count >= 20:
                  continue
              spans = msg.get('spans', [])
              span = next((s for s in spans if s.get('is_primary')), {})
              location = ''
              if span:
                  location = 'file=' + escape(span['file_name']) + ',line=' + str(span['line_start']) + ','
              print('::error ' + location + 'title=Game bridge compile::' + escape((msg.get('rendered') or msg['message'])[:5000]))
              count += 1
          if any('panicked at' in line or 'test result: FAILED' in line for line in test_output):
              print('::error title=Game bridge CPU tests::' + escape('\n'.join(test_output[-85:])))
          PY
          exit "$status"
      - name: Run real game HUD through GL2
        env:
          HORIZON_OSMESA_LIBRARY: libOSMesa.so.8
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '2.0'
          MESA_GLSL_VERSION_OVERRIDE: '120'
        run: |
          cargo test --locked -p horizon-client-render --features legacy-gl --lib paged_hud::tests::
          for filter in gui_bridge:: legacy_gfx::tests:: legacy_gfx::animation::gpu_tests:: legacy_gfx::reload::gpu_tests:: legacy_gfx::streaming::gpu_tests:: renderer_facade::tests:: renderer_owner::tests:: renderer_owner::bootstrap_tests::; do
            if cargo test --locked -p horizon-client-render --features legacy-gl --lib "$filter" -- --ignored > target/legacy-branch/gpu-tests.log 2>&1; then
              cat target/legacy-branch/gpu-tests.log
            else
              cat target/legacy-branch/gpu-tests.log
              python3 - <<'PYFAIL'
          from pathlib import Path
          text = '\n'.join(Path('target/legacy-branch/gpu-tests.log').read_text().splitlines()[-85:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Real game GL2 tests::' + text)
          PYFAIL
              exit 1
            fi
          done
      - name: Validate native Game startup selection and profile
        run: |
          cargo test --locked -p horizon-client --no-default-features --features legacy-gl --lib game::render_startup::tests::
      - name: Lint the game bridges and GL2 coordinator
        shell: bash
        run: |
          set +e
          cargo clippy --locked -p horizon-client-render --features legacy-gl --lib --tests --message-format=json -- -D warnings > target/legacy-branch/clippy.jsonl 2> target/legacy-branch/clippy.stderr
          status=$?
          cat target/legacy-branch/clippy.stderr
          python3 - <<'PYLINT'
          import json
          from pathlib import Path
          def escape(value):
              return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          for line in Path('target/legacy-branch/clippy.jsonl').read_text().splitlines():
              try:
                  record = json.loads(line)
              except ValueError:
                  print(line)
                  continue
              if record.get('reason') != 'compiler-message':
                  continue
              msg = record['message']
              if msg.get('level') != 'error':
                  continue
              span = next((s for s in msg.get('spans', []) if s.get('is_primary')), {})
              location = 'file=' + escape(span['file_name']) + ',line=' + str(span['line_start']) + ',' if span else ''
              print('::error ' + location + 'title=Game bridge Clippy::' + escape((msg.get('rendered') or msg['message'])[:5000]))
          PYLINT
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-branch-game-check
          path: target/legacy-branch/
  gl2-runtime:
    name: legacy/gl2
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - name: Check independent renderer and run real GL2 readbacks
        env:
          HORIZON_OSMESA_LIBRARY: libOSMesa.so.8
        run: |
          cargo fmt --manifest-path crates/horizon-legacy-render/Cargo.toml --all -- --check
          cargo test --offline --manifest-path crates/horizon-legacy-render/Cargo.toml --workspace
          cargo clippy --offline --manifest-path tools/legacy-gl-probe/Cargo.toml --all-targets -- -D warnings
          python3 tools/legacy_gl_smoke.py --context osmesa
          python3 -m unittest discover -s tests -p 'test_legacy_gl_smoke.py'
          python3 -m unittest discover -s tests -p 'test_cargo_github_vendor.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-branch-gl2-report
          path: target/legacy-gl-probe/report.json

  windows-x86-abi:
    name: legacy/windows-x86
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          targets: i686-pc-windows-msvc
          components: clippy
      - name: Execute x86 CPU and native event-contract tests (not Win7 runtime)
        shell: pwsh
        run: |
          # Preserve native test failure diagnostics in check annotations too:
          # sandbox egress cannot retrieve the redirected Actions log blob.
          $ErrorActionPreference = 'Continue'
          $output = & cargo test --offline --locked --manifest-path crates/horizon-legacy-render/Cargo.toml --workspace --target i686-pc-windows-msvc 2>&1
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($status -ne 0) {
            $message = (($output | Select-Object -Last 65) -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Native x86 window tests::$message"
          }
          exit $status
      - name: Compile and link the native x86 probe (not Win7 qualification)
        run: |
          cargo clippy --offline --locked --manifest-path tools/legacy-gl-probe/Cargo.toml --target i686-pc-windows-msvc --all-targets -- -D warnings
          cargo build --offline --locked --manifest-path tools/legacy-gl-probe/Cargo.toml --release --target i686-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: probe-modern-windows-x86-not-win7-qualified
          path: tools/legacy-gl-probe/target/i686-pc-windows-msvc/release/horizon-legacy-gl-probe.exe
          if-no-files-found: error

  required:
    name: legacy/required
    needs: [scope, policy-tests, modern, terrain-integration, gl2-runtime, windows-x86-abi]
    if: always() && needs.scope.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Final gate is also base-owned for task PRs.
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'arena/a7e96628-horizon' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Reject missing, skipped, cancelled or stale candidate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/legacy_required.py
