name: Legacy GL branch validation
# This session's branch only. No shared workflow or other branch is changed.
on:
  push:
    branches: ['arena/a7e96628-horizon']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/horizon-render-api/**'
      - 'crates/horizon-legacy-render/**'
      - 'crates/horizon-client-render/**'
      - 'tools/legacy-gl-probe/**'
      - 'tools/legacy_gl_smoke.py'
      - 'tests/test_legacy_gl_smoke.py'
      - '.github/workflows/legacy-gl-branch.yml'
      # Crate-wide globs above also include READMEs: omit docs-only pushes.
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-gl-branch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terrain-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libosmesa6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-gl-branch
      - name: Compile the game bridges and check the full client
        shell: bash
        run: |
          mkdir -p target/legacy-branch
          set +e
          cargo test --locked -p horizon-client-render --features legacy-gl --lib bridge::tests:: --message-format=json > target/legacy-branch/compiler.jsonl 2> target/legacy-branch/cargo.stderr
          status=$?
          if [ "$status" -eq 0 ]; then
            cargo check --locked -p horizon-client --no-default-features --features horizon-client-render/legacy-gl --message-format=json > target/legacy-branch/full-client.jsonl 2>> target/legacy-branch/cargo.stderr
            status=$?
          fi
          cat target/legacy-branch/cargo.stderr
          # Standard check annotations make compiler failures readable through the
          # checks API, even when downloading full logs/artifacts is unavailable.
          python3 - <<'PY'
          import json
          from pathlib import Path
          def escape(value):
              return str(value).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          count = 0
          for line in (Path('target/legacy-branch/compiler.jsonl').read_text() + '\n' + (Path('target/legacy-branch/full-client.jsonl').read_text() if Path('target/legacy-branch/full-client.jsonl').exists() else '')).splitlines():
              try:
                  record = json.loads(line)
              except ValueError:
                  print(line)
                  continue
              if record.get('reason') != 'compiler-message':
                  continue
              msg = record['message']
              if msg.get('level') != 'error' or count >= 20:
                  continue
              spans = msg.get('spans', [])
              span = next((s for s in spans if s.get('is_primary')), {})
              location = ''
              if span:
                  location = 'file=' + escape(span['file_name']) + ',line=' + str(span['line_start']) + ','
              print('::error ' + location + 'title=Game bridge compile::' + escape((msg.get('rendered') or msg['message'])[:5000]))
              count += 1
          PY
          exit "$status"
      - name: Run real game HUD through GL2
        env:
          HORIZON_OSMESA_LIBRARY: libOSMesa.so.8
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: '2.0'
          MESA_GLSL_VERSION_OVERRIDE: '120'
        run: |
          cargo test --locked -p horizon-client-render --features legacy-gl --lib paged_hud::tests::
          cargo test --locked -p horizon-client-render --features legacy-gl --lib gui_bridge:: -- --ignored
          cargo test --locked -p horizon-client-render --features legacy-gl --lib legacy_gfx::tests:: -- --ignored
      - name: Lint the game bridges and GL2 coordinator
        run: cargo clippy --locked -p horizon-client-render --features legacy-gl --lib --tests -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-branch-game-check
          path: target/legacy-branch/
  gl2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Install OSMesa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - name: Check independent renderer and run real GL2 readbacks
        env:
          HORIZON_OSMESA_LIBRARY: libOSMesa.so.8
        run: |
          cargo fmt --manifest-path crates/horizon-legacy-render/Cargo.toml --all -- --check
          cargo test --offline --manifest-path crates/horizon-legacy-render/Cargo.toml --workspace
          cargo clippy --offline --manifest-path tools/legacy-gl-probe/Cargo.toml --all-targets -- -D warnings
          python3 tools/legacy_gl_smoke.py --context osmesa
          python3 -m unittest discover -s tests -p 'test_legacy_gl_smoke.py'
          python3 -m unittest discover -s tests -p 'test_cargo_github_vendor.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-branch-gl2-report
          path: target/legacy-gl-probe/report.json

  windows-x86-abi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          targets: i686-pc-windows-msvc
          components: clippy
      - name: Execute x86 CPU and native event-contract tests (not Win7 runtime)
        run: cargo test --offline --locked --manifest-path crates/horizon-legacy-render/Cargo.toml --workspace --target i686-pc-windows-msvc
      - name: Compile and link the native x86 probe (not Win7 qualification)
        run: |
          cargo clippy --offline --locked --manifest-path tools/legacy-gl-probe/Cargo.toml --target i686-pc-windows-msvc --all-targets -- -D warnings
          cargo build --offline --locked --manifest-path tools/legacy-gl-probe/Cargo.toml --release --target i686-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: probe-modern-windows-x86-not-win7-qualified
          path: tools/legacy-gl-probe/target/i686-pc-windows-msvc/release/horizon-legacy-gl-probe.exe
          if-no-files-found: error
