name: GL2 test diagnostics
# Temporary: runs the same tests as verify, without stopping at the first failing binary, and prints the failing
# tests and their panic lines as one annotation (the only channel that survives the sandbox). Removed once green.
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - crates/horizon-client-render/**
      - .github/workflows/gl2-lint.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Tests with every failure listed
        run: |
          set +e
          cargo +stable test --workspace --lib --bins --tests --no-fail-fast > test.txt 2>&1
          code=$?
          python3 - "$code" <<'PY'
          import re, sys
          code = sys.argv[1]
          lines = open("test.txt", errors="replace").read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if re.search(r"FAILED|panicked|error\[|error:|Running |failures:|test result: FAILED", l):
                  keep.append(l.rstrip())
          text = f"exit={code}\n" + "\n".join(keep)
          tail = "\n".join(lines[-40:])
          text = (text + "\n--- tail ---\n" + tail)[:40000]
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=gl2-tests::{esc}")
          PY
