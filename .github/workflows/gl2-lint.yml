name: GL2 lint diagnostics
# Temporary: prints rustfmt and clippy output of horizon-client-render as one annotation, the only channel that survives
# the sandbox. Removed once the GL2 modules are clean.
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - crates/horizon-client-render/**
      - .github/workflows/gl2-lint.yml
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gl2-lint
      - name: Formatting and clippy of horizon-client-render
        run: |
          set +e
          cargo +stable fmt --all -- --check > fmt.txt 2>&1
          fmt_exit=$?
          cargo +stable clippy -p horizon-client-render --all-targets --message-format=json -- -D warnings > clippy.json 2> clippy.err
          clippy_exit=$?
          python3 - "$fmt_exit" "$clippy_exit" <<'PY'
          import json, sys
          fmt_exit, clippy_exit = sys.argv[1], sys.argv[2]
          out = [f"fmt exit={fmt_exit} clippy exit={clippy_exit}"]
          out += [l.rstrip() for l in open("fmt.txt", errors="replace") if l.startswith("Diff in ")]
          for line in open("clippy.json", errors="replace"):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-message":
                  continue
              msg = m["message"]
              if msg["level"] not in ("error", "warning"):
                  continue
              spans = [s for s in msg["spans"] if s.get("is_primary")] or msg["spans"]
              where = f'{spans[0]["file_name"]}:{spans[0]["line_start"]}' if spans else "-"
              code = (msg.get("code") or {}).get("code", "")
              out.append(f'{msg["level"]} {where} [{code}] {msg["message"]}')
          out.append("--- clippy stderr (tail) ---")
          out += open("clippy.err", errors="replace").read()[-3000:].splitlines()
          text = "\n".join(out)[:40000]
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=gl2-lint::{esc}")
          PY
