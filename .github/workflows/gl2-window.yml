# The game's OpenGL 2.1 window (crates/horizon-client-gl2, phase 1 of docs/plans/opengl21-radeon-x1650.md).
#   windows-window  Windows x64: unit tests, then the window on Mesa llvmpipe capped to OpenGL 2.1 and
#                   GLSL 1.20. The window must present frames and pass gate G1 at its own size.
#   win7-i686       Builds the window for i686-win7-windows-msvc (Windows 7 32-bit, build-std), checks the
#                   imports for Windows 8+, uploads the exe, and runs it on the system OpenGL 1.1 (WOW64):
#                   there it must refuse to draw and say why, with a report.
# llvmpipe is a CPU rasteriser: these check what the API allows, not speed and not the X1650's driver.
name: GL 2.1 game window

on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - crates/horizon-client-gl2/**
      - crates/horizon-gl2/**
      - .github/workflows/gl2-window.yml

permissions:
  contents: read

jobs:
  windows-window:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: crates/horizon-client-gl2
    steps:
      - uses: actions/checkout@v4

      # The logs of these runs cannot be downloaded from the sandbox, so the compiler's and the tests'
      # error lines go out as annotations. A failing test does not stop the window run: its frames
      # are evidence too. The last step fails the job either way.
      - name: Unit tests (x64)
        id: tests
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force out | Out-Null
          cargo test --release 2>&1 | Out-File -FilePath out\test.log -Encoding utf8
          $status = $LASTEXITCODE
          Get-Content out\test.log | Select-String -CaseSensitive -Pattern '^error|panicked|FAILED|-->' | Select-Object -First 40 | ForEach-Object { Write-Output "::error title=unit tests::$($_.Line)" }
          exit $status

      - name: Build the window (x64)
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --release --bin horizon-client-gl2 2>&1 | Out-File -FilePath out\build.log -Encoding utf8
          $status = $LASTEXITCODE
          Get-Content out\build.log | Select-String -CaseSensitive -Pattern '^error|-->' | Select-Object -First 40 | ForEach-Object { Write-Output "::error title=build::$($_.Line)" }
          exit $status

      - name: Mesa llvmpipe for Windows (x64 opengl32.dll)
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Failures are printed as annotations: the logs of this sandbox's runs cannot be read.
          try {
            $url = 'https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z'
            Invoke-WebRequest -Uri $url -OutFile mesa.7z -UseBasicParsing
            $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
            if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
            & $sevenZip x mesa.7z -omesa -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "7z exited with $LASTEXITCODE (using $sevenZip)" }
            $candidates = @(Get-ChildItem -Path mesa -Recurse -Filter 'opengl32*.dll')
            $gl = $candidates | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
            if (-not $gl -and $candidates.Count -eq 1) { $gl = $candidates[0] }
            if (-not $gl) { throw 'no x64 opengl32*.dll in the Mesa archive' }
            $source = $gl.DirectoryName
            $dllFiles = @(Get-ChildItem -Path $source -Filter '*.dll')
            $dllFiles | Copy-Item -Destination crates/horizon-client-gl2/target/release/
            Copy-Item -Path $gl.FullName -Destination crates/horizon-client-gl2/target/release/opengl32.dll -Force
            Write-Output "::notice title=mesa::copied $($dllFiles.Count) DLLs from $source; $($gl.Name) as opengl32.dll"
          } catch {
            Write-Output "::error title=mesa::$($_.Exception.Message)"
            exit 1
          }

      # Runs for 120 frames, then closes. Each frame is checked and presented, and the report is written
      # even when the run fails, so the annotation step can say why.
      - name: "Window, capped to OpenGL 2.1 and GLSL 1.20 (120 frames)"
        continue-on-error: true
        env:
          MESA_GL_VERSION_OVERRIDE: "2.1"
          MESA_GLSL_VERSION_OVERRIDE: "120"
        run: .\target\release\horizon-client-gl2.exe --frames 120 --out out\window.json

      - name: Every frame must pass
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TESTS_OUTCOME -ne 'success') {
            Write-Output "::error title=unit tests::the unit tests did not pass (see the annotations above)"
            $testsFailed = $true
          }
          $path = 'out/window.json'
          if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
            Write-Output "::error title=window::no report written: the window did not finish"
            exit 1
          }
          $r = Get-Content $path -Raw | ConvertFrom-Json
          $checks = @($r.checks)
          $summary = ($checks | ForEach-Object { if ($_.ok) { "$($_.name)=ok" } else { "$($_.name)=FAIL" } }) -join ' '
          Write-Output "::notice title=window::GL $($r.gl_version) | $($r.renderer) | window $($r.window.width)x$($r.window.height) | frames $($r.frames) | error: $($r.error) | checks: $summary"
          foreach ($check in $checks) {
            if (-not $check.ok) { Write-Output "::error title=window::$($check.name): $($check.detail)" }
          }
          if ($r.pass -ne $true) {
            Write-Output "::error title=window::did not pass"
            exit 1
          }
          if ($testsFailed) { exit 1 }
          Write-Output "::notice title=window::the game window presented $($r.frames) frames and passed gate G1"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl2-window-windows-report
          path: crates/horizon-client-gl2/out/
          if-no-files-found: warn

  win7-i686:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: crates/horizon-client-gl2
    steps:
      - uses: actions/checkout@v4

      # The Windows 7 target is tier 3: no prebuilt std, so it is built from rust-src with build-std.
      - name: Nightly toolchain with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Build the window for i686-win7-windows-msvc
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo +nightly build --release --bin horizon-client-gl2 --target i686-win7-windows-msvc -Z build-std=std,panic_abort

      # Rust 1.78+ std calls Windows 8+ APIs on the normal Windows targets; the Windows 7 targets avoid them,
      # and winit or this crate must not add any. The check fails on API-set imports and known Windows 8+ names.
      - name: Imports must stay within Windows 7
        run: |
          python -m pip install --quiet pefile
          python ../horizon-gl2/scripts/check_win7_imports.py target/i686-win7-windows-msvc/release/horizon-client-gl2.exe

      - name: Upload the Windows 7 window
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-gl2-win7-i686
          path: crates/horizon-client-gl2/target/i686-win7-windows-msvc/release/horizon-client-gl2.exe
          if-no-files-found: error

      # No 32-bit Mesa build is published, so the exe runs here on Microsoft's own opengl32.dll under WOW64:
      # OpenGL 1.1. The window must open, the context must attach, and the run must end with a report that
      # names the OpenGL 2.1 requirement and exits with status 2. Drawing on 1.1 would crash, so this is the test.
      - name: 32-bit run on the system OpenGL 1.1 (WOW64) must refuse cleanly
        run: |
          $ErrorActionPreference = 'Continue'
          .\target\i686-win7-windows-msvc\release\horizon-client-gl2.exe --frames 3 --out out\win32-system.json
          $exit = $LASTEXITCODE
          $path = 'out/win32-system.json'
          if (-not (Test-Path $path) -or (Get-Item $path).Length -eq 0) {
            Write-Output "::error title=win32::no report written (exit $exit): the 32-bit exe did not finish"
            exit 1
          }
          $r = Get-Content $path -Raw | ConvertFrom-Json
          $ok = $true
          if ($r.gl_version -notmatch '^1\.1') { Write-Output "::error title=win32::expected the system OpenGL 1.1, got '$($r.gl_version)'"; $ok = $false }
          if ($r.pass -ne $false) { Write-Output "::error title=win32::the run must not pass on OpenGL 1.1"; $ok = $false }
          if ($r.error -notmatch 'OpenGL 2\.1') { Write-Output "::error title=win32::the report must name the OpenGL 2.1 requirement, got '$($r.error)'"; $ok = $false }
          if ($exit -ne 2) { Write-Output "::error title=win32::exit status must be 2, got $exit"; $ok = $false }
          Write-Output "::notice title=win32::exit $exit | GL $($r.gl_version) | $($r.renderer) | error: $($r.error)"
          if ($ok) { Write-Output "::notice title=win32::the 32-bit window ran end to end and refused the driver cleanly"; exit 0 }
          exit 1

      - name: Upload the 32-bit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-gl2-win32-report
          path: crates/horizon-client-gl2/out/
          if-no-files-found: warn
