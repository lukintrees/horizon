name: GL2 compile diagnostics
# Temporary: type-checks the renderer and the game with every compiler message kept, and prints them as one
# annotation (the only channel that survives the sandbox). When rustfmt disagrees, the formatted tree's
# diff goes out as base64 annotations too. Removed once the OpenGL 2 path builds.
on:
  workflow_dispatch:
  push:
    branches: [arena/**]
    paths:
      - crates/**
      - .github/workflows/gl2-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
          save-if: false
      - name: Check with every message listed
        run: |
          set +e
          cargo +stable clippy -p horizon-client-render -p horizon-client --all-targets --message-format=short > check.txt 2>&1
          code=$?
          python3 - "$code" <<'PY'
          import re, sys
          code = sys.argv[1]
          lines = open("check.txt", errors="replace").read().splitlines()
          keep = [l.rstrip() for l in lines if re.search(r"error|warning: unused|warning: .*never|does not|not found", l)]
          text = f"exit={code}\n" + "\n".join(keep)
          tail = "\n".join(lines[-30:])
          text = (text + "\n--- tail ---\n" + tail)[:40000]
          esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=gl2-check::{esc}")
          PY
      - name: Formatting diff as base64 annotations
        run: |
          set +e
          cargo +stable fmt --all -- --check > /dev/null 2>&1
          fmt_code=$?
          echo "::error title=fmt::fmt exit=${fmt_code}"
          if [ "$fmt_code" != "0" ]; then
            cargo +stable fmt --all
            git diff > fmt.patch
            wc -c fmt.patch
            base64 -w0 fmt.patch | fold -w 15000 > fmt.b64
            n=$(wc -l < fmt.b64)
            i=0
            while read -r chunk; do
              i=$((i+1))
              echo "::error title=fmt-patch ${i}/${n}::${chunk}"
            done < fmt.b64
          fi
