name: legacy OpenGL
on:
  push:
    paths:
      - 'crates/horizon-legacy-gl/**'
      - 'crates/horizon-client-render/src/legacy/**'
      - 'crates/horizon-client-render/Cargo.toml'
      - 'crates/horizon-client-render/src/gfx.rs'
      - 'crates/horizon-client-render/src/gfx/lightmap.rs'
      - 'crates/horizon-client/Cargo.toml'
      - 'crates/horizon-client-lib/Cargo.toml'
      - 'tools/build_win7_x86.ps1'
      - 'crates/horizon-client-render/examples/legacy_gl_window.rs'
      - 'tools/legacy_gl_*'
      - 'tools/pe_imports.py'
      - 'tools/win7_symbol_users.py'
      - 'tools/win7_link_trace.ps1'
      - 'tests/test_pe_imports.py'
      - '.github/workflows/legacy-opengl.yml'
  pull_request:
    paths:
      - 'crates/horizon-legacy-gl/**'
      - 'crates/horizon-client-render/src/legacy/**'
      - 'crates/horizon-client-render/Cargo.toml'
      - 'crates/horizon-client-render/src/gfx.rs'
      - 'crates/horizon-client-render/src/gfx/lightmap.rs'
      - 'crates/horizon-client/Cargo.toml'
      - 'crates/horizon-client-lib/Cargo.toml'
      - 'tools/build_win7_x86.ps1'
      - 'crates/horizon-client-render/examples/legacy_gl_window.rs'
      - 'tools/legacy_gl_*'
      - 'tools/pe_imports.py'
      - 'tools/win7_symbol_users.py'
      - 'tools/win7_link_trace.ps1'
      - 'tests/test_pe_imports.py'
      - '.github/workflows/legacy-opengl.yml'
  workflow_dispatch:
    inputs:
      trace_link:
        description: Trace the Win7 link instead of running optional window tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  llvmpipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Mesa and client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libasound2-dev libudev-dev libgl-dev libx11-dev libxkbcommon-x11-0 xvfb xauth
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-opengl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run GL 2.0/2.1 and CPU smoke tests
        run: |
          tools/legacy_gl_e2e.sh
          python3 -m unittest discover -s tests -p test_pe_imports.py -v
      # Attach the end of a failed build to an annotation so it can be inspected
      # through the checks API as well as the runner's downloadable logs.
      - name: Check the client-render crate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          if cargo clippy --locked -p horizon-client-render --features legacy-scene --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/legacy-clippy.log"; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-clippy.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
      - name: Test legacy adapters in the real crate
        if: github.event_name == 'workflow_dispatch' && !inputs.trace_link
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          if cargo test --locked -p horizon-client-render --features legacy-scene --lib legacy:: 2>&1 | tee "$RUNNER_TEMP/legacy-test.log"; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-test.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
      - name: Build and test an X11 GL window
        if: github.event_name == 'workflow_dispatch' && !inputs.trace_link
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          {
            cargo clippy --locked -p horizon-client-render --features legacy-gl-window --example legacy_gl_window -- -D warnings &&
            cargo build --locked -p horizon-client-render --features legacy-gl-window --example legacy_gl_window &&
            LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 MESA_GL_VERSION_OVERRIDE=2.1 MESA_GLSL_VERSION_OVERRIDE=120 xvfb-run -a target/debug/examples/legacy_gl_window --smoke &&
            LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 MESA_GL_VERSION_OVERRIDE=2.0 MESA_EXTENSION_OVERRIDE='-GL_ARB_pixel_buffer_object -GL_EXT_pixel_buffer_object' xvfb-run -a target/debug/examples/legacy_gl_window --smoke
          } 2>&1 | tee "$RUNNER_TEMP/legacy-window.log" && exit 0
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-window.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
  windows-i686:
    if: github.event_name == 'workflow_dispatch' && !inputs.trace_link
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy
      - name: Check 32-bit WGL context code
        run: cargo clippy --locked -p horizon-legacy-gl --features window-context --all-targets --target i686-pc-windows-msvc -- -D warnings
      - name: Run 32-bit native WGL probe
        run: cargo run --locked -p horizon-legacy-gl --features window-context --target i686-pc-windows-msvc --example wgl_probe
  win7-i686:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
      # Rust does not distribute std for the tier-3 Win7 target. Build it from
      # the matching nightly sources, not from the Windows 10+ prebuilt target.
      - name: Build probe with Windows 7 standard library
        run: cargo +nightly build -Z build-std=std,panic_abort --locked -p horizon-legacy-gl --features window-context --target i686-win7-windows-msvc --example wgl_probe
      - name: Run Win7-targeted probe on hosted Windows
        if: github.event_name == 'workflow_dispatch' && !inputs.trace_link
        run: ./target/i686-win7-windows-msvc/debug/examples/wgl_probe.exe
      - name: Inventory static PE imports (not a compatibility verdict)
        shell: pwsh
        run: |
          python tools/pe_imports.py target/i686-win7-windows-msvc/debug/examples/wgl_probe.exe --github-annotations --check-win7 | Tee-Object -FilePath wgl-static-imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-win7-x86-wgl-probe
          path: |
            target/i686-win7-windows-msvc/debug/examples/wgl_probe.exe
            wgl-static-imports.txt
          retention-days: 7
      - name: Build the actual game for the Win7 target
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          if pwsh -NoProfile -File tools/build_win7_x86.ps1 -AllowKnownIncompatibleImports 2>&1 | tee "$RUNNER_TEMP/win7-client-check.log"; then
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          log = Path(os.environ['RUNNER_TEMP'], 'win7-client-check.log').read_text(errors='replace')
          match = re.search(r'^error(?:\[[^]]+\])?:', log, re.MULTILINE)
          text = (log[match.start():match.start() + 1800] + '\n...\n' + log[-650:]) if match else log[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
      - name: Inventory game static imports (not a compatibility verdict)
        shell: pwsh
        run: |
          python tools/pe_imports.py target/i686-win7-windows-msvc/debug/horizon-client.exe --github-annotations | Tee-Object -FilePath win7-client-static-imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-win7-x86-client-imports
          path: win7-client-static-imports.txt
          retention-days: 7
      - name: Locate libraries using the Windows 8 time API
        if: github.event_name == 'workflow_dispatch' && !inputs.trace_link
        shell: pwsh
        run: |
          $sysroot = rustc +nightly --print sysroot
          $nm = Join-Path $sysroot 'lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-nm.exe'
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Lib'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          $msvc = Join-Path $vs 'VC/Tools/MSVC'
          python tools/win7_symbol_users.py --nm "$nm" --symbol GetSystemTimePreciseAsFileTime target/i686-win7-windows-msvc/debug "$kits" "$msvc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Trace the final Win7 client link
        if: github.event_name == 'workflow_dispatch' && inputs.trace_link
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 2
        run: ./tools/win7_link_trace.ps1
      - name: Upload linker trace
        if: github.event_name == 'workflow_dispatch' && inputs.trace_link && always()
        uses: actions/upload-artifact@v4
        with:
          name: win7-link-trace
          path: ${{ runner.temp }}/win7-link-trace.txt
          if-no-files-found: ignore
          retention-days: 2
