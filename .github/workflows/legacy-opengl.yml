name: legacy OpenGL
on:
  push:
    paths:
      - 'crates/horizon-legacy-gl/**'
      - 'crates/horizon-client-render/src/legacy/**'
      - 'crates/horizon-client-render/Cargo.toml'
      - 'crates/horizon-client-render/examples/legacy_gl_window.rs'
      - 'tools/legacy_gl_*'
      - '.github/workflows/legacy-opengl.yml'
  pull_request:
    paths:
      - 'crates/horizon-legacy-gl/**'
      - 'crates/horizon-client-render/src/legacy/**'
      - 'crates/horizon-client-render/Cargo.toml'
      - 'crates/horizon-client-render/examples/legacy_gl_window.rs'
      - 'tools/legacy_gl_*'
      - '.github/workflows/legacy-opengl.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  llvmpipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Mesa and client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libasound2-dev libudev-dev libgl-dev libx11-dev libxkbcommon-x11-0 xvfb xauth
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: legacy-opengl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run GL 2.1 and CPU smoke tests
        run: tools/legacy_gl_e2e.sh
      # Attach the end of a failed build to an annotation so it can be inspected
      # through the checks API as well as the runner's downloadable logs.
      - name: Check the client-render crate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          if cargo clippy --locked -p horizon-client-render --lib --tests -- -D warnings 2>&1 | tee "$RUNNER_TEMP/legacy-clippy.log"; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-clippy.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
      - name: Test legacy adapters in the real crate
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          if cargo test --locked -p horizon-client-render --lib legacy:: 2>&1 | tee "$RUNNER_TEMP/legacy-test.log"; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-test.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
      - name: Build and test an X11 GL window
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_BUILD_JOBS: 2
        run: |
          set -o pipefail
          {
            cargo clippy --locked -p horizon-client-render --features legacy-gl-window --example legacy_gl_window -- -D warnings &&
            cargo build --locked -p horizon-client-render --features legacy-gl-window --example legacy_gl_window &&
            LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 MESA_GL_VERSION_OVERRIDE=2.1 MESA_GLSL_VERSION_OVERRIDE=120 xvfb-run -a target/debug/examples/legacy_gl_window --smoke &&
            LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 MESA_GL_VERSION_OVERRIDE=2.0 MESA_EXTENSION_OVERRIDE='-GL_ARB_pixel_buffer_object -GL_EXT_pixel_buffer_object' xvfb-run -a target/debug/examples/legacy_gl_window --smoke
          } 2>&1 | tee "$RUNNER_TEMP/legacy-window.log" && exit 0
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'legacy-window.log').read_text(errors='replace')[-2500:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + text)
          PY
          exit 1
  windows-i686:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
          components: clippy
      - name: Check 32-bit WGL context code
        run: cargo clippy --locked -p horizon-legacy-gl --features window-context --all-targets --target i686-pc-windows-msvc -- -D warnings
      - name: Run 32-bit native WGL probe
        run: cargo run --locked -p horizon-legacy-gl --features window-context --target i686-pc-windows-msvc --example wgl_probe
